# Mindlet — full local stack (frontends + API + platform)
#
# From mindlet-app:
#   docker compose up --build
#
# From monorepo root:
#   docker compose -f mindlet-app/compose.yml up --build
#
# Optional shared env (interpolation in included API fragments):
#   KAFKA_BROKER=kafka:29092

services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    hostname: dashboard
    expose:
      - "3001"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - app-network
    restart: unless-stopped

