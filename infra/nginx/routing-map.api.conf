map $uri $upstream_service {
    default                     "unknown";
    ~^/api/v1/auth/             "auth-service";
    ~^/api/v1/user/             "user-service";
    ~^/api/v1/subscription/     "subscription-service";
    ~^/api/v1/payment/          "payment-service";
    ~^/api/v1/notification/     "notification-service";
    ~^/api/v1/course/           "course-service";
    ~^/api/v1/ai/               "ai-service";
    ~^/api/v1/team/             "team-service";
    ~^/api/v1/lesson/           "lesson-service";
    ~^/api/v1/analytics/        "analytics-service";
    ~^/api/v1/deck/             "deck-service";
    ~^/api/v1/card/             "deck-service";
    ~^/api/v1/deck-session/     "deck-service";
    ~^/api/v1/test/             "test-service";
    ~^/api/v1/storage/          "storage-service";
}
