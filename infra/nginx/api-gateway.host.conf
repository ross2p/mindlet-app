# API gateway for local dev when backends are exposed on the host (Docker port maps 4002–4015).
# Run from mindlet-app:
#   nginx -p "$(pwd)/infra/nginx" -c api-gateway.host.conf
#
# Requires nginx installed locally. Frontends use NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api/v1

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  include routing-map.api.conf;
  include logging.conf;

  upstream mindlet_auth_api {
    server 127.0.0.1:4002;
  }

  upstream mindlet_user_api {
    server 127.0.0.1:4003;
  }

  upstream mindlet_subscription_api {
    server 127.0.0.1:4005;
  }

  upstream mindlet_payment_api {
    server 127.0.0.1:4006;
  }

  upstream mindlet_notification_api {
    server 127.0.0.1:4007;
  }

  upstream mindlet_course_api {
    server 127.0.0.1:4008;
  }

  upstream mindlet_ai_api {
    server 127.0.0.1:4009;
  }

  upstream mindlet_team_api {
    server 127.0.0.1:4010;
  }

  upstream mindlet_lesson_api {
    server 127.0.0.1:4011;
  }

  upstream mindlet_analytics_api {
    server 127.0.0.1:4012;
  }

  upstream mindlet_deck_api {
    server 127.0.0.1:4013;
  }

  upstream mindlet_test_api {
    server 127.0.0.1:4014;
  }

  upstream mindlet_storage_api {
    server 127.0.0.1:4015;
  }

  server {
    listen 4000;
    server_name localhost;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_set_header X-Upstream-Service $upstream_service;

    location /api/v1/auth/ {
      proxy_pass http://mindlet_auth_api;
    }

    location /api/v1/user/ {
      proxy_pass http://mindlet_user_api;
    }

    location /api/v1/subscription/ {
      proxy_pass http://mindlet_subscription_api;
    }

    location /api/v1/payment/ {
      proxy_pass http://mindlet_payment_api;
    }

    location /api/v1/notification/ {
      proxy_pass http://mindlet_notification_api;
    }

    location /api/v1/course/ {
      proxy_pass http://mindlet_course_api;
    }

    location /api/v1/ai/ {
      proxy_pass http://mindlet_ai_api;
    }

    location /api/v1/team/ {
      proxy_pass http://mindlet_team_api;
    }

    location /api/v1/lesson/ {
      proxy_pass http://mindlet_lesson_api;
    }

    location /api/v1/analytics/ {
      proxy_pass http://mindlet_analytics_api;
    }

    location /api/v1/deck/ {
      proxy_pass http://mindlet_deck_api;
    }

    location /api/v1/card/ {
      proxy_pass http://mindlet_deck_api;
    }

    location /api/v1/deck-session/ {
      proxy_pass http://mindlet_deck_api;
    }

    location /api/v1/test/ {
      proxy_pass http://mindlet_test_api;
    }

    location /api/v1/storage/ {
      proxy_pass http://mindlet_storage_api;
    }
  }
}
