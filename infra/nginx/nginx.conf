worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/proxy.conf;

  resolver 127.0.0.11 ipv6=off valid=30s;

  upstream mindlet_dashboard { server dashboard:3001; }
  upstream mindlet_auth      { server auth:3002; }
  upstream mindlet_profile   { server profile:3003; }
  upstream mindlet_study     { server study:3004; }
  upstream mindlet_decks     { server decks:3005; }

  server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    location = / {
      return 302 /dashboard/;
    }

    location /dashboard/ {
      proxy_pass http://mindlet_dashboard;
    }

    location /auth/ {
      proxy_pass http://mindlet_auth;
    }

    location /profile/ {
      proxy_pass http://mindlet_profile;
    }

    location /study/ {
      proxy_pass http://mindlet_study;
    }

    location /decks/ {
      proxy_pass http://mindlet_decks;
    }
  }
}
